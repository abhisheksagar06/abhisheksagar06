<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">

<style>
.bg{fill:#0b0b10}
.card{fill:#11111a;stroke:#ff0080;stroke-width:2}
.title{font:700 28px Arial,sans-serif;fill:#ffffff}
.subtitle{font:600 18px Arial,sans-serif;fill:#ff4da6}
.text{font:400 17px Arial,sans-serif;fill:#eeeeee}
.label{font:700 17px Arial,sans-serif;fill:#ff4da6}
.value{font:400 17px Arial,sans-serif;fill:#ffffff}
.small{font:400 15px Arial,sans-serif;fill:#bcbcc8}
.badge{fill:#7928ca}
</style>

<rect class="bg" x="0" y="0" width="1000" height="420" rx="28"/>
<rect class="card" x="10" y="10" width="980" height="400" rx="24"/>
<text class="title" x="45" y="58">🎯 MY GOAL</text>
<rect class="badge" x="45" y="75" width="75" height="4" rx="2"/>

<text class="subtitle" x="45" y="125">🚀 Become a Strong Software Developer</text>
<text class="text" x="45" y="165">Build strong foundations in:</text>
<text class="value" x="45" y="200">Java • Spring Boot • Backend • Databases • DSA</text>
<text class="text" x="45" y="245">Build useful applications, strengthen software engineering fundamentals,</text>
<text class="text" x="45" y="270">and continuously improve through hands-on development.</text>
<rect x="45" y="305" width="130" height="42" rx="21" fill="#ff0080"/><text x="110" y="332" text-anchor="middle" font="700 15px Arial" fill="#fff">LEARN</text>
<rect x="195" y="305" width="130" height="42" rx="21" fill="#7928ca"/><text x="260" y="332" text-anchor="middle" font="700 15px Arial" fill="#fff">BUILD</text>
<rect x="345" y="305" width="130" height="42" rx="21" fill="#ff0080"/><text x="410" y="332" text-anchor="middle" font="700 15px Arial" fill="#fff">TEST</text>
<rect x="495" y="305" width="150" height="42" rx="21" fill="#7928ca"/><text x="570" y="332" text-anchor="middle" font="700 15px Arial" fill="#fff">IMPROVE</text>

</svg>