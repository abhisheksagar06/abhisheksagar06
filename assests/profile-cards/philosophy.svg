<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">

<style>
.bg{fill:#0b0b10}
.card{fill:#11111a;stroke:#ff0080;stroke-width:2}
.title{font:700 28px Arial,sans-serif;fill:#ffffff}
.subtitle{font:600 18px Arial,sans-serif;fill:#ff4da6}
.text{font:400 17px Arial,sans-serif;fill:#eeeeee}
.label{font:700 17px Arial,sans-serif;fill:#ff4da6}
.value{font:400 17px Arial,sans-serif;fill:#ffffff}
.small{font:400 15px Arial,sans-serif;fill:#bcbcc8}
.badge{fill:#7928ca}
</style>

<rect class="bg" x="0" y="0" width="1000" height="420" rx="28"/>
<rect class="card" x="10" y="10" width="980" height="400" rx="24"/>
<text class="title" x="45" y="58">💭 DEVELOPER PHILOSOPHY</text>
<rect class="badge" x="45" y="75" width="75" height="4" rx="2"/>

<text x="500" y="155" text-anchor="middle" font="700 24px 'Courier New',monospace" fill="#ff4da6">while(true) { learn(); build(); solve(); improve(); }</text>
<line x1="180" y1="190" x2="820" y2="190" stroke="#292936"/>
<text class="text" x="500" y="245" text-anchor="middle">"Don't just write code. Understand it, improve it,</text>
<text class="text" x="500" y="275" text-anchor="middle">and build something useful."</text>

</svg>